spring.application.name=backend
server.port=3001

# "dev" (H2 in-memory, zero setup) is the default so the project still runs with a single
# `mvn spring-boot:run`. Switch to the Postgres-backed profile for production:
#   SPRING_PROFILES_ACTIVE=prod mvn spring-boot:run
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

jwt.secret=${JWT_SECRET:OpenBlogPlatformSecretKeyThatIsAtLeast32BytesLongForHS256Algorithm}
jwt.expiration=${JWT_EXPIRATION:86400000}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8080}
