# Production profile: PostgreSQL. Point it at a real database via env vars
# (see docker-compose.yml at the repo root for a ready-to-run Postgres instance).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/openblog}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:openblog}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:openblog}
spring.datasource.driverClassName=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
